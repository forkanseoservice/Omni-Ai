name: Build Windows EXE & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer & Portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Omni-Ai-Windows-EXE
          path: |
            dist-win/*.exe
          if-no-files-found: error

  build-android-apk:
    name: Build Android Mobile App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add & Sync Capacitor Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Custom Omni Ai Android Launcher & Adaptive Icons
        run: |
          python3 -m pip install -q pillow
          python3 - << 'PYEOF'
          import os, shutil
          from PIL import Image, ImageDraw

          src_path = "assets/icon.png" if os.path.exists("assets/icon.png") else "public/icon.png"
          res_dir = "android/app/src/main/res"
          src = Image.open(src_path).convert("RGBA")

          def make_full_bleed(icon_rgba, size):
              bg = Image.new("RGBA", (size, size), (0, 0, 0, 255))
              px = bg.load()
              for y in range(size):
                  for x in range(size):
                      t = (x + y) / (2.0 * size)
                      if t < 0.5:
                          u = t * 2.0
                          r = int(146 * (1 - u) + 219 * u)
                          g = int(102 * (1 - u) + 79 * u)
                          b = int(255 * (1 - u) + 236 * u)
                      else:
                          u = (t - 0.5) * 2.0
                          r = int(219 * (1 - u) + 255 * u)
                          g = int(79 * (1 - u) + 132 * u)
                          b = int(236 * (1 - u) + 112 * u)
                      px[x, y] = (r, g, b, 255)
              fg = icon_rgba.resize((size, size), Image.LANCZOS)
              bg.paste(fg, (0, 0), fg)
              return bg

          def make_round(img_sq):
              s = img_sq.size[0]
              m = Image.new("L", (s, s), 0)
              ImageDraw.Draw(m).ellipse([0, 0, s - 1, s - 1], fill=255)
              out = Image.new("RGBA", (s, s), (0, 0, 0, 0))
              out.paste(img_sq, (0, 0), m)
              return out

          def make_adaptive_fg(icon_rgba, size):
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              inner = int(size * 0.72)
              fg = icon_rgba.resize((inner, inner), Image.LANCZOS)
              off = (size - inner) // 2
              canvas.paste(fg, (off, off), fg)
              return canvas

          full_512 = make_full_bleed(src, 512)
          densities = {
              "mipmap-mdpi": (48, 108),
              "mipmap-hdpi": (72, 162),
              "mipmap-xhdpi": (96, 216),
              "mipmap-xxhdpi": (144, 324),
              "mipmap-xxxhdpi": (192, 432),
          }

          for folder, (legacy_sz, fg_sz) in densities.items():
              dpath = os.path.join(res_dir, folder)
              os.makedirs(dpath, exist_ok=True)
              sq = full_512.resize((legacy_sz, legacy_sz), Image.LANCZOS)
              sq.save(os.path.join(dpath, "ic_launcher.png"), "PNG")
              make_round(sq).save(os.path.join(dpath, "ic_launcher_round.png"), "PNG")
              make_adaptive_fg(full_512, fg_sz).save(os.path.join(dpath, "ic_launcher_foreground.png"), "PNG")

          drawable_dir = os.path.join(res_dir, "drawable")
          os.makedirs(drawable_dir, exist_ok=True)
          bg_xml = """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient
                  android:type="linear"
                  android:angle="315"
                  android:startColor="#9266FF"
                  android:centerColor="#DB4FEC"
                  android:endColor="#FF8470" />
          </shape>
          """
          with open(os.path.join(drawable_dir, "ic_launcher_background.xml"), "w") as f:
              f.write(bg_xml)

          anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
          os.makedirs(anydpi, exist_ok=True)
          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          """
          with open(os.path.join(anydpi, "ic_launcher.xml"), "w") as f:
              f.write(adaptive_xml)
          with open(os.path.join(anydpi, "ic_launcher_round.xml"), "w") as f:
              f.write(adaptive_xml)

          for old_fg in ["drawable/ic_launcher_foreground.xml", "drawable-v24/ic_launcher_foreground.xml"]:
              p = os.path.join(res_dir, old_fg)
              if os.path.exists(p):
                  os.remove(p)

          print("Custom Omni Ai Android icons generated successfully!")
          PYEOF

      - name: Enable Cleartext Traffic & Microphone Permissions in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omni-Ai-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

